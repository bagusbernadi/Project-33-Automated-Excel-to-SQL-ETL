name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project/requirements.txt
      - run: pip install -r project/requirements.txt
      - name: Unit test (aturan transform, validasi, run ulang, karantina, rekonsiliasi kecil)
        working-directory: project
        run: python -m pytest tests -q
      - name: Smoke test pipeline penuh (generate, ETL 2 run, query)
        working-directory: project/code
        run: |
          python 1-data-preparation/python/01_generate_messy_logs.py
          python 1-data-preparation/python/02_run_etl.py
          python 2-analysis/python/03_run_queries.py
