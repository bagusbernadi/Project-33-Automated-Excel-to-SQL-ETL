name: daily_etl
# Contoh jadwal ETL harian. Pada simulasi ini file log dibuat ulang oleh generator (seed tetap);
# pada pemakaian nyata, langkah generate diganti dengan folder/penyimpanan tempat file operator masuk.
on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 05:00 WIB
  workflow_dispatch:
jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project/requirements.txt
      - run: pip install -r project/requirements.txt
      - working-directory: project/code
        run: |
          python 1-data-preparation/python/01_generate_messy_logs.py
          python 1-data-preparation/python/02_run_etl.py
      - uses: actions/upload-artifact@v4
        with:
          name: etl-results
          path: project/results/1-data-preparation/
